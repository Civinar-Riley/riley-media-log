name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # ---------- 正式站（log.civinar.eu.cc）----------
      - name: 应用迁移（正式站）
        run: npx wrangler d1 migrations apply riley-media-log --remote
        env:
          CLOUDFLARE_ENV: prod
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 类型检查 + 构建 + 部署（正式站）
        run: npm run deploy
        env:
          CLOUDFLARE_ENV: prod
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---------- 演示站（logdemo.civinar.eu.cc，数据每两天自动重置）----------
      - name: 应用迁移（演示站）
        run: npx wrangler d1 migrations apply riley-media-log-demo --remote
        env:
          CLOUDFLARE_ENV: demo
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 类型检查 + 构建 + 部署（演示站）
        run: npm run deploy
        env:
          CLOUDFLARE_ENV: demo
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
